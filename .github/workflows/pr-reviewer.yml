name: PR Reviewer

# Triggered on PR creation/update, mirroring agent-eve's pipeline (#137).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-reviewer:
    runs-on: ubuntu-latest
    # Reviewer: cap a hung job (the script has its own 30s fetch timeout, but
    # this bounds the whole job to avoid burning Actions minutes).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Fetch all history for diff
          persist-credentials: false # zizmor: avoid credential persistence via artifacts
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # global fetch() is available from Node 18+ (reviewer: version note)
          node-version: '20'
      - name: Run PR Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'openai/gpt-4o-mini' }}
        run: |
          node scripts/pr-reviewer.js
