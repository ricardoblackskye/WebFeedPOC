---
name: MegaLinter

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # MegaLinter compares the pull-request diff with the default branch.
          # Keep checkout credentials available because this repository is private.
          persist-credentials: true

      # Grype and Trivy bootstrap databases inside MegaLinter's Docker container.
      # Reclaim the runner's preinstalled images and SDKs before that bootstrap so
      # disk exhaustion is not mistaken for a clean vulnerability scan.
      # NOTE: android/dotnet/haskell removal is omitted because it hangs on runners.
      - name: Reclaim runner disk space for scanner databases
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489 # v1.1.2
        with:
          large-packages: true
          docker-images: true
          tools-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies on the RUNNER (reliable filesystem). The MegaLinter
      # Docker container bind-mounts the workspace, so node_modules is visible
      # inside it. We deliberately do NOT run `npm ci` inside the container:
      # installing there is unreliable (npm hits "directory not empty" rmdir
      # errors on @types/node etc.). --include=dev guards against
      # NODE_ENV=production omitting eslint etc.
      - name: Install dependencies (incl. dev) for MegaLinter ESLint
        run: npm ci --include=dev

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0
        env:
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main'
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MegaLinter reports
          include-hidden-files: true
          path: |
            megalinter-reports
            mega-linter.log
