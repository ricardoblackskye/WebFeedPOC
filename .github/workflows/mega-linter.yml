name: MegaLinter

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # MegaLinter compares the pull-request diff with the default branch.
          # Keep checkout credentials available because this repository is private.
          persist-credentials: true

      # Grype and Trivy bootstrap databases inside MegaLinter's Docker container.
      # Reclaim the runner's preinstalled images and SDKs before that bootstrap so
      # disk exhaustion is not mistaken for a clean vulnerability scan.
      - name: Reclaim runner disk space for scanner databases
        uses: insightsengineering/disk-space-reclaimer@dae9fabcb8febe09f6585471948acf9dc9a57489
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tools-cache: true

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v10
        env:
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main'
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: true
          path: |
            megalinter-reports
            mega-linter.log
