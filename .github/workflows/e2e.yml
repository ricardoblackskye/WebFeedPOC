name: e2e

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: |
            test-results/
            playwright-report/
